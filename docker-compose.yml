# FixKart full stack
#
#   backend  : Express + Supabase API        -> http://localhost:5000
#   modern   : React storefront (new design) -> http://localhost:5173
#
# The backend needs Supabase credentials. Copy docker/.env.example to .env
# at the repo root and fill in SUPABASE_URL / SUPABASE_ANON_KEY, or export
# them in your shell before running `docker compose up`.

services:
  backend:
    build:
      context: ./backend
    environment:
      PORT: "5000"
      SUPABASE_URL: ${SUPABASE_URL:?Set SUPABASE_URL in the root .env file (see docker/.env.example)}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:?Set SUPABASE_ANON_KEY in the root .env file (see docker/.env.example)}
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/api/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  modern:
    build:
      context: .
      dockerfile: docker/modern.Dockerfile
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
